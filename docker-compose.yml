name: atlas-o-meter

services:
  app:
    image: atlas-o-meter:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    user: "1000:1000"
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/atlas.db
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env before starting Atlas-o-meter}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in .env before starting Atlas-o-meter}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:?Set WEBAUTHN_ORIGIN in .env before starting Atlas-o-meter}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?Set WEBAUTHN_RP_ID in .env before starting Atlas-o-meter}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env before starting Atlas-o-meter}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in .env before starting Atlas-o-meter}
      ATLAS_EDWARD_EMAIL: ${ATLAS_EDWARD_EMAIL:?Set ATLAS_EDWARD_EMAIL in .env before starting Atlas-o-meter}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - atlas_data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/health/ready').then((response) =>
          process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  atlas_data:
